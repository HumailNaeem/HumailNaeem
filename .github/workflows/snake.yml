name: Generate Snake Animation

on:
  # Runs at midnight UTC every day
  schedule:
    - cron: "0 0 * * *"
  
  # Allows manual trigger
  workflow_dispatch:
  
  # Runs on push to main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generate dark mode snake
      - name: Generate Snake (Dark Mode)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: humailnaeem
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=0:58a6ff;1:1f6feb;2:388bfd;3:58a6ff
            dist/github-snake.svg?palette=github&color_snake=0:58a6ff;1:1f6feb;2:388bfd;3:58a6ff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Push generated files to output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
